<!DOCTYPE html>

<html>

    <head>

        <title>Page Title</title>

    </head>

    <body>

        <form action="save.html" method="GET">

          <fieldset>

            <legend><b>Personal Information</b></legend>

            <img src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y" alt="Default Profile">

            

            <label><b>First Name</b></label>

            <input type="text" placeholder=" Enter First Name" name="Fname"><br>

            

            <label><b>Last Name</b></label><br>

            <input type="text" placeholder=" Enter Last Name" name="Lname"><br>

            

            <label><b>Middle Initial</b></label><br>

            <input type="text" placeholder=" Enter Middle Name" name="mname"><br>

        

            <label><b>Email Address</b></label><br>

            <input type="email" placeholder=" you@example.com"><br>

            

            <label><b>Password</b></label><br>

            <input type="password" placeholder=" Create a Password" name="pass"><br>

        

            <label><b>Age</b></label><br>

            <input type="number" placeholder=" e.g. 16" name="Age"><br>

            

            <label><b>Birthday</b></label><br>

            <input type="date" placeholder=" mm/dd/yy" name="Bday"><br>

        

            <label><b>Contact Number</b></label><br>

            <textarea rows="1" cols="40">09XXXXXXXXX</textarea>

          </fieldset>

          <form action="" >

          <fieldset>

            <legend><b>Student Information</b></legend>

            <label><b>Student Id</b></label>

            <textarea rows="1" cols="40">e.g. 2526m00242</textarea>

            

            <label><b>Grade Level</b></label>

            <select>

                <option>Grade Level</option>

                <option>11</option>

                <option>12</option>

            </select>

            <br>

            <label><b>Strand</b></label>

            <select>

                <option>Select Strand</option>

                <option>TVL</option>

                <option>HUMSS</option>

                <option>STEM</option>

                <option>SPORTS</option>

            </select>

          </fieldset>

          

          <form action="" >

          <fieldset>

             <legend><b>Additional Information</b> </legend>

           <label><b>Gender</b></label><br>

           <input type="radio" required>Male<br><input type="radio" required>Female<br>

           <input type="radio" required>Prefer Not To Say<br>

           

           <label><b>Hobbies</b></label><br>

           <input type="checkbox" required>Reading<br>

           <input type="checkbox" required>Coding<br>

           <input type="checkbox" required>Playing Sports<br>

           <input type="checkbox" required>Watching Movies<br>

           <input type="checkbox" required>Playing Games<br>

           <input type="checkbox" required>Music<br>

           

           <label><b>Complete Adress</b></label>

           <textarea rows="10" cols="60">House No., Street, Barangay, City/Municipality, Province</textarea>

           <h6>maximum of 250 characters</h6>

           <button>Submit</button><button>Reset</button>

        </form>

    </body>

</html>
